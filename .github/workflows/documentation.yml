name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.3'
      - name: Install pinned documentation tools
        run: make -f docs/source/Makefile setup
      - name: Install the browser and its CI dependencies
        run: .venv/bin/playwright install --with-deps chromium
      - name: Build, validate reference coverage, and check committed output
        run: make -f docs/source/Makefile check
