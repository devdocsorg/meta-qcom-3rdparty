name: DevDocs build on push

on:
  push:
    branches:
      - devdocs/build
      - devdocs/build-*

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: read

# One shared AWS runner: serialize builds, queue instead of cancel.
concurrency:
  group: aws-yocto-runner
  cancel-in-progress: false

jobs:
  start-runner:
    name: Start AWS runner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start runner instance
        # No polling needed: the self-hosted build jobs queue until the
        # runner service comes online on the instance.
        run: aws ec2 start-instances --instance-ids "$AWS_RUNNER_ID"
        env:
          AWS_RUNNER_ID: ${{ secrets.AWS_RUNNER_ID }}

  build:
    needs: start-runner
    uses: ./.github/workflows/build-yocto.yml

  stop-runner:
    name: Stop AWS runner
    # List every job that uses the self-hosted runner.
    needs: [build]
    # Stop the instance even when the build fails or is cancelled.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop runner instance
        run: aws ec2 stop-instances --instance-ids "$AWS_RUNNER_ID"
        env:
          AWS_RUNNER_ID: ${{ secrets.AWS_RUNNER_ID }}
