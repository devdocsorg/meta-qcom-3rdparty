name: DevDocs CI


on:
  pull_request:
    branches:
      - devdocs/master
  push:
    branches:
      - devdocs/master
      - devdocs/build-*   # manual escape hatch for long-lived experiments

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: read
  id-token: write

concurrency:
  group: devdocs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  start-runner:
    name: Start AWS runner
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start runner instance
        run: aws ec2 start-instances --instance-ids "$AWS_RUNNER_ID"
        env:
          AWS_RUNNER_ID: ${{ secrets.AWS_RUNNER_ID }}

  build:
    needs: start-runner
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-yocto.yml
    secrets: inherit
