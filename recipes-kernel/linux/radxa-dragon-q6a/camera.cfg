# Camera support: Qualcomm CAMSS ISP plus CSI camera sensor drivers.
# CONFIG_VIDEO_QCOM_CAMSS is set defensively — the linux-qcom-next defconfig
# state is unconfirmed; merge_config.sh keeps the fragment's value if the
# defconfig disagrees.
CONFIG_VIDEO_QCOM_CAMSS=m

# Sensors — extend this list as camera modules are wired up in the board DT.
CONFIG_VIDEO_IMX219=m
